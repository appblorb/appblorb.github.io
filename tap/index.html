<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F3F0">
<meta name="robots" content="noindex">
<title>that’s a blorb.</title>
<!--
  Where a blorb's NFC tag lands when the phone that tapped it does not have the app
  (with the app installed, iOS opens the app instead and this page is never shown).
  Links look like  /tap/?b=soot&s=7K3F9QX25WXX
-->
<style>
:root { --paper: #F2F3F0; --ink: #1E1D1F; --grey: #55525A; --font: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', 'Nunito', system-ui, sans-serif; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; background: var(--page, var(--paper)); color: var(--ink);
  font-family: var(--font); font-weight: 500; font-size: 18px; line-height: 1.5; -webkit-font-smoothing: antialiased; transition: background-color .4s ease;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); }
main { width: 100%; max-width: 30em; text-align: center; }
h1 { margin: 0; font-weight: 900; font-size: clamp(44px, 13vw, 84px); line-height: 1; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: .8em auto 0; max-width: 24em; text-wrap: pretty; }
.cta { margin-top: 1.8em; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 10px 28px; border-radius: 999px; background: var(--ink); color: var(--paper);
  font-weight: 800; font-size: 1.02em; line-height: 1.1; text-decoration: none; transition: transform .18s cubic-bezier(.3, 1.6, .5, 1); }
.btn:active { transform: scale(.96); }
.btn.line { background: transparent; color: var(--ink); border: 3px solid var(--ink); }
.cap { margin-top: 1.6em; font-size: .82em; color: var(--grey); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <h1 id="title">that’s a blorb.</h1>
  <p id="line">a small magnetic buddy that locks your distracting apps until you get up and tap it.</p>
  <div class="cta">
    <a class="btn" id="open" href="blorb://tap">open the blorb app</a>
    <a class="btn line" href="/">what’s a blorb?</a>
  </div>
  <p class="cap" id="cap">got the app? open it and tap your blorb again, or use the button above.</p>
</main>
<script>
(function () {
  var BLORBS = {
    soot: ['#D9D8DC', 'the deadpan one. squat, slouchy, tiny smirk.'],
    pip: ['#FFC3BA', 'the hype one. tall, tilted head, biggest grin.'],
    dew: ['#CDEFE3', 'the calm one. melted flat like a puddle.'],
    bean: ['#FBEBAF', 'the goofball. lopsided lean, mismatched eyes.'],
    mim: ['#DFD5F6', 'the shy one. smallest, eyes close together.'],
    glub: ['#C3DEF9', 'the dreamer. roundest belly, always looking up.']
  };
  var q = new URLSearchParams(location.search), b = (q.get('b') || '').toLowerCase(), s = (q.get('s') || '').toUpperCase();
  if (BLORBS[b]) {
    document.documentElement.style.setProperty('--page', BLORBS[b][0]);
    var meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', BLORBS[b][0]);
    document.getElementById('title').textContent = 'that’s ' + b + '.';
    document.getElementById('line').textContent = BLORBS[b][1] + ' it locks your distracting apps until you get up and tap it.';
    document.title = 'that’s ' + b + '.';
  }
  // hand the same tag over to the app; the app then asks for one more real tap
  if (b && /^[0-9A-Z]{12}$/.test(s)) document.getElementById('open').href = 'blorb://tap?b=' + encodeURIComponent(b) + '&s=' + encodeURIComponent(s);
})();
</script>
</body>
</html>
