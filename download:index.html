<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#8FD9C0">
<meta name="robots" content="noindex">
<title>get the blorb app.</title>
<meta property="og:title" content="get the blorb app.">
<meta property="og:description" content="the app that goes with your blorb.">
<!--
  Where the QR code on the welcome card lands: blorb.app/download
  The printed code never changes. Change the SETTINGS below to change what people see.
-->
<script>
/* ============================ SETTINGS ============================
   Edit only this block, then save (commit) the file.

   appStoreUrl   paste the App Store link between the quotes once the
                 app is live, e.g. 'https://apps.apple.com/app/id1234567890'
                 leave it as '' while the app is not out yet.

   skipThisPage  false = show this page with a download button
                 true  = send people straight to the App Store
                 (only does anything once appStoreUrl is filled in)
   ================================================================= */
var SETTINGS = {
  appStoreUrl: '',
  skipThisPage: false,

  // what the page says before the app is out
  soonTitle: 'almost here.',
  soonLine: 'the blorb app isn’t on the app store just yet. leave your email and we’ll tell you the second it is.',
  soonButton: 'tell me when it’s out',
  soonButtonLink: '/#waitlist',

  // what the page says once the app is out
  liveTitle: 'get the app.',
  liveLine: 'download blorb, then tap your blorb’s belly to set it up.',
  liveButton: 'download on the app store'
};
/* ========================== END SETTINGS ========================== */

var LIVE = /^https:\/\/\S+$/.test(SETTINGS.appStoreUrl || '');
if (LIVE && SETTINGS.skipThisPage) location.replace(SETTINGS.appStoreUrl);
</script>
<style>
:root { --paper: #F2F3F0; --ink: #1E1D1F; --mint: #8FD9C0; --font: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', 'Nunito', system-ui, sans-serif; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; background: var(--mint); color: var(--ink);
  font-family: var(--font); font-weight: 500; font-size: 18px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); }
main { width: 100%; max-width: 30em; text-align: center; }
h1 { margin: 0; font-weight: 900; font-size: clamp(44px, 13vw, 84px); line-height: 1; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: .8em auto 0; max-width: 24em; text-wrap: pretty; }
.cta { margin-top: 1.8em; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 10px 28px; border-radius: 999px; background: var(--ink); color: var(--paper);
  font-weight: 800; font-size: 1.02em; line-height: 1.1; text-decoration: none; transition: transform .18s cubic-bezier(.3, 1.6, .5, 1); }
.btn:active { transform: scale(.96); }
.btn.line { background: transparent; color: var(--ink); border: 3px solid var(--ink); }
.cap { margin-top: 1.6em; font-size: .86em; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <h1 id="title">almost here.</h1>
  <p id="line">the blorb app isn’t on the app store just yet. leave your email and we’ll tell you the second it is.</p>
  <div class="cta">
    <a class="btn" id="go" href="/#waitlist">tell me when it’s out</a>
    <a class="btn line" href="/">what’s a blorb?</a>
  </div>
  <p class="cap">blorb is for iphone.</p>
</main>
<script>
(function () {
  var S = SETTINGS, live = LIVE;
  var title = live ? S.liveTitle : S.soonTitle;
  document.getElementById('title').textContent = title;
  document.getElementById('line').textContent = live ? S.liveLine : S.soonLine;
  var go = document.getElementById('go');
  go.textContent = live ? S.liveButton : S.soonButton;
  go.href = live ? S.appStoreUrl : S.soonButtonLink;
  document.title = live ? 'get the blorb app.' : 'the blorb app is almost here.';
})();
</script>
</body>
</html>
